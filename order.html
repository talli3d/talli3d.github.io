<style>
:root{--ink:#14201d;--muted:#5b6b67;--line:#dfe5e3;--teal:#0f766e;--teal-soft:#e3f2ef;--orange:#e07a1f;--bg:#f4f6f5;--card:#fff;--red:#b42318}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
html[lang=ar] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-right)) 130px max(16px,env(safe-area-inset-left))}
header{display:flex;align-items:center;gap:12px;padding:10px 0 6px}
.brand{display:block;line-height:0;border-radius:12px}
.brand img{height:64px;width:auto;display:block}
.lang{flex:none;min-height:38px;padding:0 16px;border-radius:19px;border:1.5px solid var(--line);background:#fff;font:600 14px inherit;cursor:pointer;margin-inline-start:auto}
.lang[lang=ar]{font-family:"IBM Plex Sans Arabic",sans-serif}
.ptitle{display:flex;align-items:baseline;gap:10px;margin:8px 0 10px}
h1{font:700 clamp(26px,6vw,34px)/1.1 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.01em}
html[lang=ar] h1{font-family:"IBM Plex Sans Arabic",sans-serif;letter-spacing:0;line-height:1.3}
.stepno{margin-inline-start:auto;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.sub{color:var(--muted);font-size:13.5px}
.prog{height:8px;border-radius:4px;background:#e4e9e7;overflow:hidden;margin:0 0 18px}.prog i{display:block;height:100%;background:var(--teal);border-radius:4px;transition:width .3s}
.bot{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.bot .av{width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;padding:4px}
.bot .av img{width:100%;height:100%}
.bubble{background:var(--card);border-radius:4px 18px 18px 18px;padding:12px 16px;font-size:16.5px}
html[dir=rtl] .bubble{border-radius:18px 4px 18px 18px}
.bubble b{display:block;margin-bottom:2px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.type{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;min-height:112px;padding:16px;border-radius:16px;border:2px solid transparent;background:#fff;font:inherit;cursor:pointer;transition:border-color .15s}
.type:hover{border-color:#b9d9d2}

.type .e{font-size:28px;line-height:1;margin-bottom:4px}.type .t{font-weight:600;font-size:16px}.type .d{font-size:13.5px;color:var(--muted)}
.type.on{border-color:var(--teal);background:var(--teal-soft)}
.aiopt{display:flex;align-items:center;gap:14px;width:100%;min-height:0;margin-bottom:12px;padding:14px 16px;border-radius:16px;border:2px solid transparent;cursor:pointer;text-align:start;font:inherit;color:#fff;
  background:linear-gradient(120deg,#0f766e,#1d4ed8 70%,#7c3aed)}
.aiopt .e{font-size:30px;line-height:1;flex:none}.aiopt .t{font-weight:700;font-size:17px;display:block}.aiopt .d{font-size:13.5px;opacity:.9;display:block}
.aiopt.on{border-color:#ffd60a}

.aiimg img{width:100%;height:100%;object-fit:cover;display:block}
.aiimg .spin{width:34px;height:34px;border-radius:50%;border:4px solid #cfe3de;border-top-color:var(--teal);animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.airow{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.airow .btn{flex:1;min-height:48px}
.ainote{font-size:13px;color:var(--muted);margin-top:8px}
label{display:block;font-size:13.5px;color:var(--muted);margin:12px 0 5px;font-weight:500}
label:first-child{margin-top:0}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fbfcfc;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:14.5px;cursor:pointer}
.chip.on{border-color:var(--teal);background:var(--teal-soft);font-weight:600}
.chip i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:inline-block}
.tips{font-size:14px;color:var(--muted);margin:0 0 12px;padding-inline-start:18px}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pic{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#eef1f0}
.pic img{width:100%;height:100%;object-fit:cover}
.pic button{position:absolute;top:5px;inset-inline-end:5px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:17px;cursor:pointer}
.add{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;border:2px dashed #a9c9c2;border-radius:14px;color:var(--teal);font-weight:600;cursor:pointer;background:#f7fbfa}
.add input{display:none}
.yn{display:flex;gap:8px;flex-wrap:wrap}
.sum{font-size:15px;margin:0}.sum dt{color:var(--muted);font-size:13px;margin-top:10px}.sum dd{margin:0;white-space:pre-line}
.err{color:var(--red);font-size:14px;margin-top:8px}

.bar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px}
.btn{font:inherit;font-weight:600;font-size:16px;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:0 20px;cursor:pointer}
.btn.go{background:var(--ink);border-color:var(--ink);color:#fff}
.btn[disabled]{opacity:.55}
.done{text-align:center;padding:30px 10px}
.done .big{width:76px;height:76px;border-radius:50%;background:var(--teal);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.oid{font:700 24px "Bricolage Grotesque",monospace;letter-spacing:.04em;margin:6px 0 4px}
.wa{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border-radius:14px;background:#1f8f4e;color:#fff;text-decoration:none;font-weight:600;margin-top:16px}
.privacy{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
@media (min-width:700px){ .types{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){ .prog i,.type{transition:none} }
</style>

// pictures are shrunk on the phone before sending: 1100 px JPEG, and 850 px if it's still over ~180 KB
function shrink(file){
  return new Promise(function(res){
    var r=new FileReader(); r.onload=function(){ var im=new Image(); im.onload=function(){
      function draw(m, q){ var sc=Math.min(1, m/Math.max(im.width,im.height)), c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
        var g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
        return c.toDataURL("image/jpeg",q); }
      try{ var d=draw(1100,0.7); if(d.length>245000) d=draw(850,0.62); res(d.length>30 ? d : null); }catch(e){ res(null); } };
      im.onerror=function(){ res(null); }; im.src=r.result; };
    r.onerror=function(){ res(null); }; r.readAsDataURL(file);
  });
}

async function aiDraw(){

  err=""; AI.busy=true; AI.err=""; draw();
  try{
    var en=idea;
    if(/[\u0600-\u06FF]/.test(idea)){            // the image model only understands English
      try{ var r=await fetch(AI_TXT+encodeURIComponent("Rewrite this customer idea as ONE short English prompt for an image generator. The picture must show the object as a real 3D-printed plastic item. Keep any names or text exactly as written. Reply with the prompt only. Idea: "+idea));
        var tx=r.ok?(await r.text()).trim():""; if(tx && tx.length<500 && !/free limit|pollinations/i.test(tx)) en=tx; }catch(_){}
    }
    O.aiPrompt=en;
    var url=AI_IMG+encodeURIComponent(en+", single 3D printed PLA plastic object, product photo, plain light background")+"?width=640&height=640&nologo=true&seed="+(1+Math.floor(Math.random()*99999));
    var res=await fetch(url);
    if(!res.ok) throw new Error("ai "+res.status);
    var pic=await shrink(await res.blob());

  return fetch(FORM,{method:"POST",mode:"no-cors",body:body}).then(function(){ return true; }, function(){ return false; }); }   // a failed part is re-sent below
async function sendRows(list, from, to, total){        // 3 parts at a time, short pause between groups
  for(var i=0;i<list.length;i+=3){
    await Promise.all(list.slice(i,i+3).map(function(r){ return post(r[0], r[1]); }));
    if(total){ busy=t("sending",Math.round(from+(to-from)*Math.min(list.length,i+3)/list.length)); draw(); }
    await wait(120);
  }
}
var lastFail=null;
function report(stage, extra){                         // a short technical note (no personal details) so Talli can see what went wrong
  try{ var n={v:1, at:new Date().toISOString(), stage:stage, ua:navigator.userAgent.slice(0,160), lang:LANG, type:O.type, pics:O.pics.length, kb:Math.round(O.pics.join("").length/1024)};
    for(var k in extra) n[k]=extra[k];
    post("x:"+rid(8), JSON.stringify(n)); }catch(e){}
}
async function submit(){
  busy=t("sending",0); draw();
  try{
    var oid="ORD-"+rid(6);
    var payload={v:1, id:oid, lang:LANG, at:new Date().toISOString(), type:O.type, typeName:O.type==="ai"?"Quick AI order (client prompt + AI picture)":TX.en.types[O.type][1], desc:O.desc, aiPrompt:O.type==="ai"?(O.aiPrompt||""):undefined,
      size:O.size, details:O.det, detailsText:detText(), colours:O.colours.map(function(i){ return TX.en.colours[i][0]; }), asPhoto:O.asPhoto,
      qty:O.qty, need:O.need, urgent:!!O.urgent, delivery:O.deliv!==""?TX.en.delivs[O.deliv]:"", area:O.area, name:O.name, phone:O.phone, notes:O.notes, pics:O.pics};
    var pub=await crypto.subtle.importKey("jwk", TALLI_KEY, {name:"ECDH",namedCurve:"P-256"}, false, []);
    var eph=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"}, true, ["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"ECDH",public:pub}, eph.privateKey, {name:"AES-GCM",length:256}, false, ["encrypt"]);
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var ct=b64(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv}, key, new TextEncoder().encode(JSON.stringify(payload))));
    var epk=await crypto.subtle.exportKey("jwk", eph.publicKey);
    var parts=[]; for(var i=0;i<ct.length;i+=CHUNK) parts.push(ct.slice(i,i+CHUNK));
    var n=parts.length, pad=function(i){ return ("00"+i).slice(-3); };
    var rows=[["o:"+oid+":000/"+n, JSON.stringify({v:1, epk:{kty:"EC",crv:"P-256",x:epk.x,y:epk.y}, iv:b64(iv), n:n})]];
    for(var j=0;j<n;j++) rows.push(["o:"+oid+":"+pad(j+1)+"/"+n, parts[j]]);
    await sendRows(rows, 0, 80, true);
    // make sure every part arrived; re-send the missing ones (up to 6 rounds, waiting a little longer each time)
    var checked=false, missing=rows;
    for(var round=0; round<7; round++){
      busy=t("checking"); draw();
      await wait([2500,3500,5000,6000,8000,10000,12000][round]);
      var got=await storedParts(oid);
      if(!got) continue;
      checked=true;
      missing=rows.filter(function(r){ return !got[r[0]]; });
      if(!missing.length) break;
      if(round===6) break;
      await sendRows(missing, 80, 95, true);
    }
    if(checked && missing.length){ var e1=new Error("missing parts"); e1.info={parts:rows.length, missing:missing.length}; throw e1; }   // if the check couldn't run at all, trust the sends
    busy=t("sending",100); draw();
    sentId=oid; busy=false; try{ sessionStorage.removeItem("talli_order"); }catch(_){}
    done();
  }catch(e){
    busy=false; lastFail=true;
    report("send", Object.assign({msg:String(e&&e.message||e).slice(0,200), subtle:!!(window.crypto&&crypto.subtle)}, (e&&e.info)||{}));
    err=t("failedWa"); draw();
    var el=document.querySelector(".err"); if(el && el.scrollIntoView) el.scrollIntoView({block:"center", behavior:"smooth"});
  }
}
function summaryText(id){
  var ty=O.type==="ai"?t("aiType"):((T().types[O.type]||["",""])[1]);
  return (id?t("waMsg",id):t("waOrder"))+"\n\n"+[[T().sumL.type,ty],[T().sumL.desc,O.desc.trim().slice(0,600)],[T().sumL.size,O.type==="ai"?"":sizeText()],[T().sumL.details,O.type==="ai"?"":detText()],
    [T().sumL.colour,colourText()],[T().sumL.qty,O.qty],[T().sumL.need,O.need],[T().sumL.urgent,O.urgent?t("urgYes"):""],[T().sumL.deliv,(O.deliv!==""?t("delivs")[O.deliv]:"")+(O.area?" · "+O.area:"")],[T().sumL.contact,O.name+" · "+O.phone],[T().sumL.notes,O.notes]]
    .filter(function(r){ return r[1]; }).map(function(r){ return "• "+r[0]+": "+r[1]; }).join("\n");
}
function done(){
  bar.remove();
  // the request also lands in Talli's WhatsApp: WhatsApp opens with the details filled in, the client taps Send
  var wa="https://wa.me/"+TALLI_WA+"?text="+encodeURIComponent(summaryText(sentId));
  setTimeout(function(){ location.href=wa; }, 1800);
  app.innerHTML=head()+'<div class="done"><div class="big">&#10003;</div><h1>'+t("doneT")+'</h1><p>'+esc(t("doneP",O.name.split(" ")[0]||""))+'</p>'+
    '<div class="sub">'+t("yourId")+'</div><div class="oid"><bdi>'+sentId+'</bdi></div><a class="wa" href="'+wa+'">'+t("waBtn")+'</a><div class="privacy">'+t("privacy")+'</div></div>';
  window.scrollTo(0,0);
}
draw();
if("serviceWorker" in navigator && location.hostname==="talli3d.github.io" && location.pathname.indexOf("/talli/")!==0) navigator.serviceWorker.register("/sw.js").catch(function(){});
</script>
