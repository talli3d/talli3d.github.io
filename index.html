<style>
:root{--ink:#14201d;--muted:#5b6b67;--line:#dfe5e3;--teal:#0f766e;--teal-soft:#e3f2ef;--orange:#e07a1f;--bg:#f4f6f5;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
html[lang=ar] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:12px;padding:14px 0}
.top img{height:54px;width:auto}
.lang{margin-inline-start:auto;min-height:38px;padding:0 16px;border-radius:19px;border:1.5px solid var(--line);background:#fff;font:600 14px inherit;cursor:pointer}
.lang[lang=ar]{font-family:"IBM Plex Sans Arabic",sans-serif}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:20px 0 34px}
h1{font:700 clamp(30px,5.2vw,48px)/1.08 "Bricolage Grotesque",sans-serif;margin:0 0 14px;letter-spacing:-.01em}
html[lang=ar] h1,html[lang=ar] h2{font-family:"IBM Plex Sans Arabic",sans-serif;letter-spacing:0;line-height:1.25}
.lead{font-size:18px;color:var(--muted);margin:0 0 22px;max-width:34em}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;font-weight:600;text-decoration:none;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:16px}
.btn.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.wa{background:#1f8f4e;color:#fff;border-color:#1f8f4e}
.heroart{background:#fff;border-radius:24px;padding:22px;display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-width:380px;justify-self:center;width:100%}
.heroart img{width:86%;height:auto}
h2{font:700 26px/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 6px}
.flagp{position:relative;overflow:hidden;border-radius:18px;background:#fff;border:1px solid #cfe3d7;box-shadow:0 6px 22px rgba(0,80,40,.07);max-width:720px;margin:0 auto}
.flagp .band{display:flex;height:10px;direction:ltr}.flagp .band .r{flex:0 0 22%;background:#ce1126}.flagp .band .s{display:flex;flex-direction:column;flex:1}.flagp .band .s i{flex:1}
.flagp .fin{padding:16px}
.flagp .fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.flagp h2{margin:0;font-size:21px;line-height:1.3}
.flagp .tag{display:inline-flex;align-items:center;background:#e9f5ee;color:#00733a;border:1px solid #bfe0cc;border-radius:999px;font-weight:700;font-size:12.5px;padding:3px 10px}
.flagp .flead{margin:4px 0 12px;font-size:14px;color:var(--muted)}
.flagp .items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:760px){ .flagp .items{grid-template-columns:repeat(4,1fr)} }
.flagp .it{background:#fff;border:1px solid #e3ece7;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.flagp .it .ph{background:#f6f8f7;border-bottom:1px solid #edf2ef;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.flagp .it img{width:88%;height:88%;object-fit:contain;display:block;mix-blend-mode:multiply}
.flagp .it .nm{font-size:13.5px;font-weight:600;line-height:1.35;padding:8px 10px 0;min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.flagp .it .pr{margin-top:auto;padding:8px 10px 10px;display:flex;align-items:baseline;gap:4px;color:#ce1126;font-weight:700;font-size:17px;white-space:nowrap}
.flagp .it .pr small{font-size:12px;font-weight:500;color:var(--muted)}
.flagp .bulk{margin-top:12px;background:#f3faf6;color:#00733a;border:1px dashed #9fd1b3;border-radius:12px;padding:8px 12px;font-weight:600;font-size:13.5px;text-align:center}
.flagp .fgo{display:flex;width:100%;margin-top:10px;background:#00843d;border-color:#00843d;color:#fff}
.flagp .small{font-size:12.5px;color:var(--muted);margin-top:8px;text-align:center}
.sec{padding:26px 0}
.sub{color:var(--muted);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.aiopt{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding:16px 18px;border-radius:16px;text-decoration:none;color:#fff;background:linear-gradient(120deg,#0f766e,#1d4ed8 70%,#7c3aed)}
.aiopt .e{font-size:32px;line-height:1;flex:none}.aiopt b{display:block;font-size:17px}.aiopt span span{display:block;font-size:13.5px;opacity:.9}
.aiopt:hover{filter:brightness(1.08)}
.card{display:flex;flex-direction:column;gap:4px;background:#fff;border-radius:16px;padding:16px;text-decoration:none;border:2px solid transparent;transition:border-color .15s}
.card:hover{border-color:var(--teal)}
.card{overflow:hidden;min-width:0}.card img{display:block;width:calc(100% + 32px);max-width:none;margin:-16px -16px 8px;height:auto;aspect-ratio:3/2;object-fit:cover;background:#eef4f2}
.card .e{font-size:28px;line-height:1}.card b{font-size:16px}.card span{font-size:13.5px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:s}
.step{background:#fff;border-radius:16px;padding:16px;position:relative}
.step::before{counter-increment:s;content:counter(s);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;margin-bottom:8px}
.step b{display:block;margin-bottom:2px}.step span{font-size:14px;color:var(--muted)}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.why div{background:var(--teal-soft);border-radius:14px;padding:14px;font-size:14px}
.why b{display:block;color:var(--teal);margin-bottom:2px}
.install{display:none;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px 16px;margin:6px 0 0}
.install.show{display:flex}
.install img{width:44px;height:44px;border-radius:10px}
.install div{flex:1;font-size:14px}.install b{display:block;font-size:15px}
footer{padding:28px 0 calc(28px + env(safe-area-inset-bottom));color:var(--muted);font-size:14px;border-top:1px solid var(--line);margin-top:20px}
footer a{text-decoration:none;font-weight:600;color:var(--ink)}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-top:6px}
  .heroart{max-width:220px;order:-1}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps,.why{grid-template-columns:1fr 1fr}
  .cta .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
/* ---- "What is Talli?" video pop-out ---- */
.tv{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.8);font-family:inherit;font-size:14px;font-weight:600;line-height:1.3;text-align:start;color:var(--ink);cursor:pointer;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s;opacity:0;animation:wIn 1s cubic-bezier(.2,.8,.2,1) .9s forwards}
html[dir=rtl] .tv{padding:6px 6px 6px 14px}
.tv:hover{transform:translateY(-2px);box-shadow:0 12px 26px -14px rgba(20,32,29,.45)}
.tv .pl{position:relative;width:34px;height:34px;border-radius:50%;background:center/cover url("https://i.ytimg.com/vi/eF5vfKH1i_U/mqdefault.jpg");flex:none}
.tv .pl::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(15,118,110,.55)}
.tv .pl::after{content:"";position:absolute;left:13px;top:10px;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent #fff}
.tv .pl i{position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(15,118,110,.5);animation:tvPulse 2.2s ease-out infinite}
@keyframes tvPulse{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.tv small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
#tvDlg{border:0;padding:0;border-radius:22px;width:min(860px,calc(100vw - 24px));background:#0c1311;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
#tvDlg[open]{animation:tvIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes tvIn{from{opacity:0;transform:translateY(24px) scale(.96)}}
#tvDlg::backdrop{background:rgba(6,12,10,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tvVid{position:relative;aspect-ratio:16/9;background:#000}
.tvVid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tvTx{padding:16px 20px 20px}
.tvTx h3{margin:0 0 6px;font:700 20px/1.25 "Bricolage Grotesque",sans-serif}
html[lang=ar] .tvTx h3{font-family:"IBM Plex Sans Arabic",sans-serif}
.tvTx p{margin:0 0 8px;font-size:14.5px;line-height:1.6;color:#c9d6d2}
.tvTx .src{font-size:12px;color:#8fa39d;margin:0}
.tvTx .src a{color:#9fe0d3}
.tvX{position:absolute;top:10px;inset-inline-end:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tvX:hover{background:rgba(0,0,0,.8)}
@media (prefers-reduced-motion:reduce){ .tv{opacity:1;animation:none}.tv .pl i{animation:none}#tvDlg[open]{animation:none} }
/* ---- header logo lockup ---- */
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);border-radius:14px;padding:2px 6px 2px 2px;-webkit-tap-highlight-color:transparent}
.bmk{position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#ffffff,#eef4f2);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 6px 16px -8px rgba(15,118,110,.45),0 0 0 1px rgba(20,32,29,.06);overflow:hidden;transition:width .35s,height .35s,border-radius .35s,transform .5s cubic-bezier(.2,.8,.2,1);animation:bIn .9s cubic-bezier(.2,.8,.2,1) both}
.bmk::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);transform:translateX(-100%);animation:bShine 1.4s .9s ease-out both}
.bmk img{width:72%;height:auto;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
@keyframes bIn{from{opacity:0;transform:scale(.6) rotate(-14deg)}}
@keyframes bShine{to{transform:translateX(100%)}}
.bw{display:flex;flex-direction:column;line-height:1;animation:bwIn .8s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes bwIn{from{opacity:0;transform:translateX(-8px)}}
html[dir=rtl] .bw{animation-name:bwInR} @keyframes bwInR{from{opacity:0;transform:translateX(8px)}}
.bw b{font:800 23px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;display:flex;align-items:baseline;gap:7px}
.bw b i{font:700 17px/1 "IBM Plex Sans Arabic",sans-serif;font-style:normal;color:rgb(254,105,1);letter-spacing:0}
.bw small{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;transition:opacity .3s,max-height .35s;max-height:16px;overflow:hidden}
html[lang=ar] .bw small{letter-spacing:0;text-transform:none;font-size:12px}
.brand:hover .bmk{transform:rotate(-6deg) scale(1.06)}.brand:hover .bmk img{transform:scale(1.06)}
.brand:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.top.glass .bmk{width:38px;height:38px;border-radius:11px}
.top.glass .bw small{opacity:0;max-height:0;margin-top:0}
@media (prefers-reduced-motion:reduce){ .bmk,.bmk::after,.bw{animation:none} .bmk::after{display:none} }
/* ---- logo story: scroll-scrubbed motion graphic (plays down, rewinds up) ---- */
.lstory{position:relative;height:380vh;width:100vw;margin-left:calc(50% - 50vw)}
.lsIn{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#ffffff 0,#f4f6f5 55%,#e9efed 100%)}
.lsWaves{position:absolute;inset:0;width:100%;height:100%}
.lsWaves path{fill:none;stroke-linecap:round}
.lsStage{position:relative;width:min(62vh,82vw);aspect-ratio:1;perspective:1100px;margin-top:-6vh}
.lsStage svg{width:100%;height:100%;overflow:visible;transform-style:preserve-3d;will-change:transform}
.lsStage .pc{transform-box:fill-box;transform-origin:center;stroke-linejoin:round}
.lsCaps{position:absolute;left:0;right:0;bottom:max(7vh,calc(24px + env(safe-area-inset-bottom)));text-align:center;padding:0 20px;min-height:5.2em}
.lsCap{position:absolute;inset:0 20px auto;opacity:0;transform:translateY(18px);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
.lsCap.on{opacity:1;transform:none}
.lsCap small{display:block;font-weight:700;color:var(--teal);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.lsCap b{display:block;font:700 clamp(24px,3.6vw,40px)/1.12 "Bricolage Grotesque",sans-serif;letter-spacing:-.015em}
html[lang=ar] .lsCap b{font-family:"IBM Plex Sans Arabic",sans-serif;letter-spacing:0;line-height:1.35}
.lsBar{position:absolute;top:calc(74px + env(safe-area-inset-top));left:50%;width:min(220px,50vw);height:3px;border-radius:2px;background:rgba(20,32,29,.1);transform:translateX(-50%);overflow:hidden;direction:ltr}
.lsBar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,rgb(16,166,225),#0f766e,rgb(254,105,1));transform-origin:left;transform:scaleX(0)}
@media (max-width:760px){ .lstory{height:360vh} .lsStage{width:min(88vw,54vh);margin-top:-4vh} }
@media (prefers-reduced-motion:reduce){ .lstory{height:auto}.lsIn{position:static;height:auto;padding:40px 0 30px}.lsWaves,.lsBar{display:none}
  .lsCaps{position:static;min-height:0}.lsCap{position:static;opacity:1;transform:none;display:none}.lsCap:last-child{display:block} }
/* ---- Apple-style motion ---- */
.top{position:sticky;top:0;z-index:20;margin:0 calc(-1*max(16px,env(safe-area-inset-left)));padding:14px max(16px,env(safe-area-inset-left));transition:background .35s,box-shadow .35s,padding .35s}
.top.glass{background:rgba(244,246,245,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 rgba(20,32,29,.08);padding-top:8px;padding-bottom:8px}
.top img{transition:height .35s}.top.glass img{height:42px}
h1 .w{display:inline-block;opacity:0;transform:translateY(.55em);filter:blur(8px);animation:wIn .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*70ms + 120ms)}
@keyframes wIn{to{opacity:1;transform:none;filter:blur(0)}}
h1 .g{background:linear-gradient(100deg,#0f766e 10%,#1d4ed8 55%,#7c3aed 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead,.hero .cta{opacity:0;transform:translateY(14px);animation:wIn 1s cubic-bezier(.2,.8,.2,1) .55s forwards}.hero .cta{animation-delay:.7s}
.heroart{position:relative;perspective:900px;background:radial-gradient(circle at 50% 40%,#ffffff 0,#ffffff 45%,#e9f3f0 100%);box-shadow:0 30px 60px -30px rgba(15,118,110,.35);animation:artIn 1.2s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes artIn{from{opacity:0;transform:scale(.92) translateY(20px)}}
.heroart::before{content:"";position:absolute;inset:12%;border-radius:50%;background:conic-gradient(from 0deg,#0f766e33,#1d4ed833,#7c3aed33,#e07a1f33,#0f766e33);filter:blur(30px);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.heroart img{position:relative;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(30px);transition:transform .5s cubic-bezier(.2,.8,.2,1);animation:float 6s ease-in-out infinite}
@keyframes float{50%{translate:0 -8px}}
.rv{opacity:0;transform:translateY(34px) scale(.98);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0)*80ms)}
.rv.in{opacity:1;transform:none}
.state{padding:70px 0 30px;text-align:center}
.state p{font:700 clamp(30px,6vw,64px)/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0 auto;max-width:15em;
  background:linear-gradient(90deg,var(--ink) 0 var(--sp,0%),#c3ccc9 var(--sp,0%) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
html[lang=ar] .state p{font-family:"IBM Plex Sans Arabic",sans-serif;letter-spacing:0;line-height:1.35;background:linear-gradient(270deg,var(--ink) 0 var(--sp,0%),#c3ccc9 var(--sp,0%) 100%);-webkit-background-clip:text;background-clip:text}
.showc{position:relative;height:420vh;margin:10px 0}
.showIn{position:sticky;top:0;height:100vh;height:100svh;display:grid;grid-template-columns:1.15fr 1fr;gap:34px;align-items:center}
.showMedia{position:relative;aspect-ratio:1;border-radius:32px;overflow:hidden;background:linear-gradient(135deg,#e3f2ef,#dbe4f7);box-shadow:0 40px 80px -40px rgba(0,0,0,.45);max-height:78vh;justify-self:center;width:100%}

.cap{position:absolute;inset:0 0 auto 0;opacity:0;transform:translateY(30px);transition:opacity .6s,transform .8s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.cap.on{opacity:1;transform:none;pointer-events:auto}

html[lang=ar] .cap h3{font-family:"IBM Plex Sans Arabic",sans-serif;letter-spacing:0;line-height:1.3}

.card{transition:border-color .15s,transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s,opacity .9s cubic-bezier(.2,.8,.2,1)}
.card img{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-6px);box-shadow:0 22px 40px -22px rgba(20,32,29,.35)}.card:hover img{transform:scale(1.06)}
.aiopt{background-size:200% 100%;animation:aiFlow 8s ease-in-out infinite alternate;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.aiopt:hover{transform:translateY(-3px);box-shadow:0 18px 36px -18px rgba(29,78,216,.6)}
@keyframes aiFlow{to{background-position:100% 0}}
.steps{position:relative}
.steps::after{content:"";position:absolute;left:16px;right:16px;top:31px;height:2px;background:linear-gradient(90deg,var(--teal),#1d4ed8);transform:scaleX(0);transform-origin:left;transition:transform 1.6s cubic-bezier(.2,.8,.2,1) .2s;z-index:0;border-radius:2px}

.step{z-index:1}
