<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talli 3D Printing</title>
<meta name="description" content="Custom 3D printing in the UAE: name keychains, gifts, replacement parts, logos and more. Order in a few taps and get your quote on WhatsApp.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Talli">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Talli 3D Printing">
<meta property="og:title" content="Talli 3D Printing – custom 3D prints in the UAE">
<meta property="og:description" content="Name keychains, gifts, replacement parts and logos. Order in a few taps, get your quote on WhatsApp.">
<meta property="og:image" content="https://talli3d.github.io/preview.png">
<meta property="og:url" content="https://talli3d.github.io/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
:root{--ink:#14201d;--muted:#5b6b67;--line:#dfe5e3;--teal:#0f766e;--teal-soft:#e3f2ef;--orange:#e07a1f;--bg:#f4f6f5;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
html[lang=ar] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:12px;padding:14px 0}
.top img{height:54px;width:auto}
.lang{margin-inline-start:auto;min-height:38px;padding:0 16px;border-radius:19px;border:1.5px solid var(--line);background:#fff;font:600 14px inherit;cursor:pointer}
.lang[lang=ar]{font-family:"IBM Plex Sans Arabic",sans-serif}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:20px 0 34px}
h1{font:700 clamp(30px,5.2vw,48px)/1.08 "Bricolage Grotesque",sans-serif;margin:0 0 14px;letter-spacing:-.01em}
html[lang=ar] h1,html[lang=ar] h2{font-family:"IBM Plex Sans Arabic",sans-serif;letter-spacing:0;line-height:1.25}
.lead{font-size:18px;color:var(--muted);margin:0 0 22px;max-width:34em}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;font-weight:600;text-decoration:none;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:16px}
.btn.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.wa{background:#1f8f4e;color:#fff;border-color:#1f8f4e}
.heroart{background:#fff;border-radius:24px;padding:22px;display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-width:380px;justify-self:center;width:100%}
.heroart img{width:86%;height:auto}
h2{font:700 26px/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 6px}
.flagp{position:relative;overflow:hidden;border-radius:18px;background:#fff;border:1px solid #cfe3d7;box-shadow:0 6px 22px rgba(0,80,40,.07);max-width:720px;margin:0 auto}
.flagp .band{display:flex;height:10px;direction:ltr}.flagp .band .r{flex:0 0 22%;background:#ce1126}.flagp .band .s{display:flex;flex-direction:column;flex:1}.flagp .band .s i{flex:1}
.flagp .fin{padding:16px}
.flagp .fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.flagp h2{margin:0;font-size:21px;line-height:1.3}
.flagp .tag{display:inline-flex;align-items:center;background:#e9f5ee;color:#00733a;border:1px solid #bfe0cc;border-radius:999px;font-weight:700;font-size:12.5px;padding:3px 10px}
.flagp .flead{margin:4px 0 12px;font-size:14px;color:var(--muted)}
.flagp .items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:760px){ .flagp .items{grid-template-columns:repeat(4,1fr)} }
.flagp .it{background:#fff;border:1px solid #e3ece7;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.flagp .it .ph{background:#f6f8f7;border-bottom:1px solid #edf2ef;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.flagp .it img{width:88%;height:88%;object-fit:contain;display:block;mix-blend-mode:multiply}
.flagp .it .nm{font-size:13.5px;font-weight:600;line-height:1.35;padding:8px 10px 0;min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.flagp .it .pr{margin-top:auto;padding:8px 10px 10px;display:flex;align-items:baseline;gap:4px;color:#ce1126;font-weight:700;font-size:17px;white-space:nowrap}
.flagp .it .pr small{font-size:12px;font-weight:500;color:var(--muted)}
.flagp .bulk{margin-top:12px;background:#f3faf6;color:#00733a;border:1px dashed #9fd1b3;border-radius:12px;padding:8px 12px;font-weight:600;font-size:13.5px;text-align:center}
.flagp .fgo{display:flex;width:100%;margin-top:10px;background:#00843d;border-color:#00843d;color:#fff}
.flagp .small{font-size:12.5px;color:var(--muted);margin-top:8px;text-align:center}
.sec{padding:26px 0}
.sub{color:var(--muted);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.aiopt{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding:16px 18px;border-radius:16px;text-decoration:none;color:#fff;background:linear-gradient(120deg,#0f766e,#1d4ed8 70%,#7c3aed)}
.aiopt .e{font-size:32px;line-height:1;flex:none}.aiopt b{display:block;font-size:17px}.aiopt span span{display:block;font-size:13.5px;opacity:.9}
.aiopt:hover{filter:brightness(1.08)}
.card{display:flex;flex-direction:column;gap:4px;background:#fff;border-radius:16px;padding:16px;text-decoration:none;border:2px solid transparent;transition:border-color .15s}
.card:hover{border-color:var(--teal)}
.card{overflow:hidden;min-width:0}.card img{display:block;width:calc(100% + 32px);max-width:none;margin:-16px -16px 8px;height:auto;aspect-ratio:3/2;object-fit:cover;background:#eef4f2}
.card .e{font-size:28px;line-height:1}.card b{font-size:16px}.card span{font-size:13.5px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:s}
.step{background:#fff;border-radius:16px;padding:16px;position:relative}
.step::before{counter-increment:s;content:counter(s);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;margin-bottom:8px}
.step b{display:block;margin-bottom:2px}.step span{font-size:14px;color:var(--muted)}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.why div{background:var(--teal-soft);border-radius:14px;padding:14px;font-size:14px}
.why b{display:block;color:var(--teal);margin-bottom:2px}
.install{display:none;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px 16px;margin:6px 0 0}
.install.show{display:flex}
.install img{width:44px;height:44px;border-radius:10px}
.install div{flex:1;font-size:14px}.install b{display:block;font-size:15px}
footer{padding:28px 0 calc(28px + env(safe-area-inset-bottom));color:var(--muted);font-size:14px;border-top:1px solid var(--line);margin-top:20px}
footer a{text-decoration:none;font-weight:600;color:var(--ink)}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-top:6px}
  .heroart{max-width:220px;order:-1}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps,.why{grid-template-columns:1fr 1fr}
  .cta .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><img src="/logo.svg" alt="Talli 3D Printing"><button class="lang" id="lang" type="button"></button></header>

  <section class="hero">
    <div>
      <h1 data-t="h1"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="cta">
        <a class="btn go" href="/order" data-t="order"></a>
        <a class="btn wa" id="wa" href="#" data-t="wa"></a>
      </div>
      <div class="install" id="install">
        <img src="/icon-192.png" alt="">
        <div><b data-t="instT"></b><span id="instHow"></span></div>
        <button class="btn" id="instBtn" type="button" data-t="instBtn" hidden></button>
      </div>
    </div>
    <div class="heroart"><img src="/mark.svg" alt=""></div>
  </section>

  <section class="sec" id="flagsec" hidden></section>

  <section class="sec">
    <h2 data-t="makeT"></h2><p class="sub" data-t="makeS"></p>
    <a class="aiopt" id="aiopt" href="/order?type=ai"></a>
    <div class="cards" id="cards"></div>
  </section>

  <section class="sec">
    <h2 data-t="howT"></h2><p class="sub" data-t="howS"></p>
    <div class="steps" id="steps"></div>
  </section>

  <section class="sec">
    <h2 data-t="whyT"></h2>
    <div class="why" id="why"></div>
  </section>

  <footer>
    <div><b>Talli 3D Printing</b> · <span data-t="where"></span></div>
    <div style="margin-top:6px"><a id="wa2" href="#">WhatsApp 058 557 9070</a></div>
  </footer>
</div>
<script>
var PHONE = "971585579070";
var TX = {
 en:{h1:"Custom 3D printing in the UAE", lead:"Name keychains, gifts, replacement parts, logos and more, designed and printed for you. Send your idea in a few taps and get your quote on WhatsApp.",
     order:"Order a print", wa:"WhatsApp us", waMsg:"Hi Talli! I'd like to ask about a 3D print.",
     instT:"Get the Talli app", instIos:"On iPhone: tap Share, then Add to Home Screen.", instAnd:"Add Talli to your home screen for quick ordering.", instBtn:"Install",
     makeT:"What we print", makeS:"Tap one to start your order.",
     types:[["key","🔑","Keychains and name tags","Names, initials, logos"],["fig","🧸","Figures and characters","Toys, models, cake toppers"],["part","🔧","Replacement parts","Broken clips, knobs, holders"],["logo","🏷️","Logos and signs","Plaques, letters, stands"],["gift","🎁","Gifts and home décor","Vases, holders, occasions"],["other","✨","Your own idea","Tell us what you need"]],
     howT:"How it works", howS:"From idea to your door, all on your phone.",
     steps:[["Send your idea","Pictures, size and colours in a few taps."],["Get your quote","We study it and reply on WhatsApp."],["Approve on your phone","Check each item and approve with one tap."],["We print and deliver","Printed in the UAE, delivered or ready for pickup."]],
     whyT:"Why Talli", why:[["Multi-colour","Up to 4 colours in one print."],["Strong materials","PLA for detail, PETG for strength and heat."],["Fair prices","Clear quotes before we start."],["Across the UAE","Delivery or pickup."]],
     where:"United Arab Emirates", langBtn:"عربي"},
 ar:{h1:"طباعة ثلاثية الأبعاد حسب الطلب في الإمارات", lead:"ميداليات بالأسماء، هدايا، قطع بديلة، شعارات وأكثر، نصممها ونطبعها لك. أرسل فكرتك بخطوات بسيطة واستلم عرض السعر عبر واتساب.",
     order:"اطلب طباعة", wa:"راسلنا على واتساب", waMsg:"مرحبًا Talli! أود الاستفسار عن طباعة ثلاثية الأبعاد.",
     instT:"حمّل تطبيق Talli", instIos:"على الآيفون: اضغط مشاركة ثم «إضافة إلى الشاشة الرئيسية».", instAnd:"أضف Talli إلى شاشتك الرئيسية للطلب بسرعة.", instBtn:"تثبيت",
     makeT:"ماذا نطبع", makeS:"اختر نوعًا لتبدأ طلبك.",
     types:[["key","🔑","ميداليات وأسماء","أسماء، حروف، شعارات"],["fig","🧸","مجسّمات وشخصيات","ألعاب، نماذج، زينة كيك"],["part","🔧","قطع بديلة","مشابك، مقابض، حوامل مكسورة"],["logo","🏷️","شعارات ولافتات","لوحات، حروف، حوامل"],["gift","🎁","هدايا وديكور","مزهريات، حوامل، مناسبات"],["other","✨","فكرتك الخاصة","أخبرنا بما تحتاجه"]],
     howT:"كيف نعمل", howS:"من الفكرة إلى باب بيتك، كله من هاتفك.",
     steps:[["أرسل فكرتك","صور، مقاسات وألوان بخطوات بسيطة."],["استلم عرض السعر","ندرس طلبك ونرد عبر واتساب."],["وافق من هاتفك","راجع كل منتج ووافق بلمسة واحدة."],["نطبع ونوصل","طباعة داخل الإمارات مع توصيل أو استلام."]],
     whyT:"لماذا Talli", why:[["ألوان متعددة","حتى 4 ألوان في قطعة واحدة."],["خامات قوية","PLA للتفاصيل وPETG للقوة والحرارة."],["أسعار عادلة","عرض سعر واضح قبل البدء."],["في كل الإمارات","توصيل أو استلام."]],
     where:"الإمارات العربية المتحدة", langBtn:"English"}
};
var LANG = (function(){ try{ var q=(location.search.match(/[?&]lang=(ar|en)(?:&|$)/)||[])[1]; if(q) return q; var v=localStorage.getItem("talli_lang"); if(v==="ar"||v==="en") return v; }catch(e){}
  return "ar"; })();
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone, deferred = null;
// Flag Day box (3 Nov): same items and prices as the order page; the button opens the order page with them filled in. Hidden after FLAG.until.
var FLAG={on:true, until:"2026-11-03T23:59:59+04:00", items:[["A","ميدالية باسمك بألوان العلم","Name keychain in flag colours",10,"",""],["B","بروش «55» بعلم الإمارات","\"55\" brooch filled with the flag",5,"",""],["C","لعبة إكس-أو بألوان العلم + كيس هدية","Pocket XO game + gift bag",25,"/ طقم","/ set"],["E","بروش «إماراتية»","\"Emiratiya\" flag brooch",20,"",""]],
  ar:{tag:"٣ نوفمبر",h:"منتجات يوم العلم",lead:"مطبوعة بألوان العلم • جاهزة للتوزيعات والهدايا",cur:"درهم",bulk:"خصم ١٠٪ من ١٠ حبات • ١٥٪ من ٢٠ حبة",go:"اطلب منتجات يوم العلم",small:"اطلب بدري عشان توصلك قبل يوم العلم • توصيل لكل الإمارات"},
  en:{tag:"3 Nov",h:"Flag Day items",lead:"Printed in the flag colours • ready for giveaways and gifts",cur:"AED",bulk:"10% off from 10 pcs • 15% off from 20 pcs",go:"Order Flag Day items",small:"Order early so it arrives before Flag Day • Delivery all over the UAE"}};
function flagBox(){ var el=document.getElementById("flagsec"), on=FLAG.on && Date.now()<=Date.parse(FLAG.until); el.hidden=!on; if(!on){ el.innerHTML=""; return; }
  var P=FLAG[LANG], ar=LANG==="ar";
  el.innerHTML='<div class="flagp"><div class="band" aria-hidden="true"><i class="r"></i><span class="s"><i style="background:#00843d"></i><i style="background:#f4f4f4"></i><i style="background:#111"></i></span></div><div class="fin">'+
    '<div class="fhead"><h2>'+P.h+'</h2><span class="tag">'+P.tag+'</span></div><p class="flead">'+P.lead+'</p><div class="items">'+FLAG.items.map(function(x){ return '<div class="it"><div class="ph"><img src="/samples/flag-'+x[0]+'.jpg" alt="'+esc(ar?x[1]:x[2])+'" width="400" height="300" loading="lazy"></div><span class="nm">'+esc(ar?x[1]:x[2])+'</span><span class="pr">'+x[3]+' '+P.cur+(x[ar?4:5]?' <small>'+esc(x[ar?4:5])+'</small>':'')+'</span></div>'; }).join("")+'</div>'+
    '<div class="bulk">'+P.bulk+'</div><a class="btn fgo" href="/order?flag=1&lang='+LANG+'">'+P.go+'</a><div class="small">'+P.small+'</div></div></div>'; }
function draw(){
  var T = TX[LANG];
  document.documentElement.lang = LANG; document.documentElement.dir = LANG==="ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = T[el.dataset.t]; });
  var lb = document.getElementById("lang"); lb.textContent = T.langBtn; lb.lang = LANG==="ar" ? "en" : "ar";
  var wa = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(T.waMsg);
  document.getElementById("wa").href = wa; document.getElementById("wa2").href = wa;
  var ai = LANG==="ar" ? ["طلب سريع بالذكاء الاصطناعي","صف طلبك بجملة واحدة، نرسم لك صورة ونتخطى الأسئلة."] : ["Quick order with AI","Describe it in one sentence. We draw a picture and skip the questions."];
  var ao = document.getElementById("aiopt"); ao.href = "/order?type=ai&lang=" + LANG;
  ao.innerHTML = '<span class="e" aria-hidden="true">✨</span><span><b>' + esc(ai[0]) + '</b><span>' + esc(ai[1]) + '</span></span>';
  document.getElementById("cards").innerHTML = T.types.map(function(x){ return '<a class="card" href="/order?type=' + x[0] + '&lang=' + LANG + '"><img src="/samples/sample-' + x[0] + '.jpg" alt="" width="480" height="320" loading="lazy"><b>' + esc(x[2]) + '</b><span>' + esc(x[3]) + '</span></a>'; }).join("");
  document.getElementById("steps").innerHTML = T.steps.map(function(x){ return '<div class="step"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>'; }).join("");
  document.getElementById("why").innerHTML = T.why.map(function(x){ return '<div><b>' + esc(x[0]) + '</b>' + esc(x[1]) + '</div>'; }).join("");
  document.querySelector(".cta .go").href = "/order?lang=" + LANG;
  flagBox();
  var ins = document.getElementById("install");
  ins.classList.toggle("show", !standalone && (isIos || !!deferred));
  document.getElementById("instHow").textContent = isIos ? T.instIos : T.instAnd;
  document.getElementById("instBtn").hidden = !deferred;
}
document.getElementById("lang").onclick = function(){ LANG = LANG==="ar" ? "en" : "ar"; try{ localStorage.setItem("talli_lang", LANG); }catch(e){} draw(); };
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred = e; draw(); });
document.getElementById("instBtn").onclick = function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.finally(function(){ deferred = null; draw(); }); };
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function(){});
draw();
</script>
</body>
</html>
